name: CI

on:
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🛠 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🧶 Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false # 依存は明示的に install するので false

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🧪 Run tests
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: 🔍 Type check
        run: pnpm run typecheck
