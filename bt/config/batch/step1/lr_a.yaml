symbol: BTCUSDTM
timeframe: 1m
initial_equity: 10000.0

split_ratio:
  train: 0.6
  validation: 0.2
  oos: 0.2

constraints:
  min_order_qty: 0.001
  price_tick: 0.1
  qty_step: 0.001
  max_leverage: 3.0

costs:
  maker_fee_bps: 2.0
  taker_fee_bps: 6.0
  slippage_bps: 3.0

execution:
  fill_failure_rates: [0.0, 0.02, 0.05]
  use_taker: false

grid_search:
  levels_per_side: [3, 4, 5]
  range_pcts: [0.01]
  leverage_values: [1.0]
  order_size_ratio_values: [0.01]

acceptance:
  min_oos_return_pct: 0.0
  max_oos_dd_pct: 8.0
  min_pf: 1.05
