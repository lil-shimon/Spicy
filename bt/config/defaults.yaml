symbol: BTCUSDTM
timeframe: 1m
initial_equity: 10000.0

split_ratio:
  train: 0.6
  validation: 0.2
  oos: 0.2

constraints:
  min_order_qty: 0.001
  price_tick: 0.1
  qty_step: 0.001
  max_leverage: 3.0

costs:
  maker_fee_bps: 2.0
  taker_fee_bps: 6.0
  slippage_bps: 3.0

execution:
  fill_failure_rates: [0.0, 0.02, 0.05]
  use_taker: false

grid_search:
  levels_per_side: [3, 4, 5, 6, 7]
  range_pcts: [0.01]
  leverage_values: [1.0, 1.5]
  order_size_ratio_values: [0.01, 0.02]

acceptance:
  min_oos_return_pct: 0.0
  max_oos_dd_pct: 8.0
  min_pf: 1.05

regime_filter:
  enabled: true
  lookback_days: 10        # ER計算（Kaufman推奨）
  er_threshold: 0.3        # ER閾値（文献最多引用値）
  ma_lookback_days: 20     # MA計算（下落方向検知、20日≒1ヶ月）
